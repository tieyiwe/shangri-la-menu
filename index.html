<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Shangri-La</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Serif+SC:wght@600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: lacquered dark-wood menu, gold leaf headings, sticky category rail, single column of dotted price rows */
  --wood:#1d1b19;
  --panel:#272421;
  --line:#3a3530;
  --gold:#d9ad55;
  --cream:#f3ead8;
  --muted:#b3a68f;
  --chili:#e0533d;
  --display:"Marcellus","Times New Roman",serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--wood);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
header{padding:28px 16px 18px;text-align:center;border-bottom:1px solid var(--line);background:radial-gradient(120% 90% at 50% 0%,#2c2824 0%,var(--wood) 70%)}
.zh{font-family:"Noto Serif SC",serif;color:var(--gold);letter-spacing:.3em;font-size:15px;margin:0 0 6px}
h1{font-family:var(--display);font-weight:400;color:var(--gold);margin:0;font-size:clamp(26px,7vw,40px);letter-spacing:.04em;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.tools{position:sticky;top:0;z-index:5;background:rgba(29,27,25,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px;padding:10px 16px 6px;max-width:760px;margin:0 auto}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:10px 12px;font:inherit}
.search input::placeholder{color:var(--muted)}
.search input:focus,.chip:focus-visible,.spicy-toggle:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.spicy-toggle{background:var(--panel);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:0 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.spicy-toggle[aria-pressed="true"]{border-color:var(--chili);color:#fff;background:#4a2119}
nav{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;max-width:760px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;text-decoration:none;color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;background:var(--panel)}
.chip.on{border-color:var(--gold);color:var(--gold)}
main{max-width:760px;margin:0 auto;padding:8px 16px 40px}
section{padding-top:18px;scroll-margin-top:118px}
h2{font-family:var(--display);font-weight:400;color:var(--gold);font-size:24px;margin:0 0 4px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.5}
.group{margin:14px 0 2px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
li .name{flex:1;min-width:0}
li.photo{cursor:pointer}
li.photo:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.thumb{flex:0 0 56px;width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--panel)}
.cam{display:inline-block;font-size:12px;color:var(--muted);margin-top:3px}
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,9,8,.88);display:none;align-items:center;justify-content:center;padding:16px}
.lb.open{display:flex}
.lb figure{margin:0;max-width:640px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lb img{display:block;width:100%;max-height:70vh;object-fit:contain;background:#000}
.lb figcaption{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;align-items:baseline}
.lb .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--cream);font-size:22px;cursor:pointer}
.lb .x:focus-visible{outline:2px solid var(--gold)}
.no{font-size:12px;font-weight:700;color:var(--wood);background:var(--gold);border-radius:4px;padding:1px 5px;min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.name{font-weight:600}
.desc{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:2px}
.chili{color:var(--chili);font-size:13px;margin-left:4px;white-space:nowrap}
.new{font-size:11px;font-weight:700;color:var(--wood);background:var(--cream);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.price{font-variant-numeric:tabular-nums;font-weight:700;color:var(--gold);white-space:nowrap;text-align:right}
.price.ask{color:var(--muted);font-weight:600;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 16px 30px;border-top:1px solid var(--line)}
header{position:relative}
.lang{position:absolute;top:12px;right:12px;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--wood);font-weight:700}
.lang button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.contact{max-width:760px;margin:0 auto;padding:8px 16px 32px;scroll-margin-top:118px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:16px}
.card h3{margin:0 0 6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.phones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phones a,.addr{display:flex;align-items:center;gap:8px;color:var(--cream);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums;font-weight:600}
.phones a:focus-visible,.wa:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.om{font-variant-numeric:tabular-nums;font-weight:600}
.wa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#1f8f4e;color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:14px;font-size:17px}
.wa-num{font-weight:600;font-size:15px;opacity:.9;font-variant-numeric:tabular-nums}
.wa-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.wa-row .wa{flex:1 1 220px}
.wa-qr{width:112px;height:112px;border-radius:8px;background:#fff;padding:4px}
.wa-note{color:var(--muted);font-size:13px;margin:6px 0 0}
@media (max-width:360px){.phones{grid-template-columns:1fr}}
.welcome{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(90% 70% at 50% 45%,#3c1812,#100e0c);cursor:pointer;transition:opacity .6s ease}
.welcome.hide{opacity:0;pointer-events:none}
.welcome canvas{position:absolute;inset:0;width:100%;height:100%}
.wbox{position:relative;text-align:center;padding:24px}
.wbox .w1{font-family:var(--display);color:var(--cream);font-size:clamp(22px,6vw,30px);letter-spacing:.08em;margin:0}
.wbox .w2{font-family:var(--display);color:var(--gold);font-size:clamp(34px,10vw,58px);margin:8px 0 6px;text-wrap:balance;text-shadow:0 2px 24px rgba(217,173,85,.35)}
.wbox .w3{font-family:"Noto Serif SC",serif;color:var(--gold);letter-spacing:.35em;font-size:16px;margin:0}
.wbox .tap{color:var(--muted);font-size:13px;margin-top:22px}
.welcome.run .w1{animation:rise .7s .15s both}
.welcome.run .w2{animation:pop .9s .45s both}
.welcome.run .w3{animation:rise .7s .9s both}
.welcome.run .tap{animation:rise .6s 1.4s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.welcome.run .w1,.welcome.run .w2,.welcome.run .w3,.welcome.run .tap{animation:none}}
body.locked{overflow:hidden}
</style>
</head>

// Les deux fondues partagent la photo
function photoFor(it){ return PHOTOS[it.name] || (it.name.startsWith("Fondue chinoise") ? PHOTOS["Fondue chinoise"] : null); }
const ALL = [];
let LANG = "fr";
try { const v = localStorage.getItem("shangrila-lang"); if (v === "zh" || v === "en") LANG = v; } catch(e){}
const T = k => UI[LANG][k];
const DICT = {zh: ZH, en: EN}, SECT = {zh: ZH_SECTIONS, en: EN_SECTIONS}, GRP = {zh: ZH_GROUPS, en: EN_GROUPS};
const tr = it => (DICT[LANG] && DICT[LANG][it.name]) || [];
const nm = it => tr(it)[0] || it.name;
const ds = it => {
  if (LANG === "fr") return it.d || "";
  const d = tr(it)[1] || "";
  // Nom français affiché dessous pour faciliter la commande auprès du personnel
  return [d, nm(it) !== it.name ? it.name : ""].filter(Boolean).join(" · ");
};
const secT = c => (SECT[LANG] && SECT[LANG][c.id]) || c.t;
const grpT = g => (GRP[LANG] && GRP[LANG][g]) || g;

const fmt = n => n.toLocaleString("fr-FR").replace(/ | /g," ") + " F";
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

const main = document.getElementById("menu");
const q = document.getElementById("q");
const spicyBtn = document.getElementById("spicy");
let spicyOnly = false;

  nav.innerHTML = MENU.map(c => `<a class="chip" href="#${c.id}" data-id="${c.id}">${esc(secT(c))}</a>`).join("")
    + `<a class="chip" href="#contact" data-id="contact">${CT[LANG].title}</a>`;
}

// Accueil animé avec confettis
const wel = document.getElementById("welcome"), cv = document.getElementById("confetti");
let wTimer = null, raf = null;
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = cv.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  const cols = ["#d9ad55","#f3d38a","#e0533d","#c4302b","#f3ead8","#ffcf4a"];
  const P = Array.from({length: 160}, (_, i) => ({
    x: W/2 + (Math.random()-.5) * W * .2, y: H * .45,
    vx: (Math.random()-.5) * 16 * dpr, vy: (-Math.random()*14 - 6) * dpr,
    w: (6 + Math.random()*6) * dpr, h: (3 + Math.random()*5) * dpr,
    r: Math.random()*Math.PI, vr: (Math.random()-.5) * .3, c: cols[i % cols.length], d: i * 4
  }));
  const t0 = performance.now();
  cancelAnimationFrame(raf);
  (function frame(t){
    const el = t - t0; ctx.clearRect(0,0,W,H); let alive = false;
    for (const p of P){
      if (el < p.d) { alive = true; continue; }
      p.vy += .32 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if (p.y < H + 20) alive = true;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, Math.abs(Math.cos(p.r)) * p.h + 1); ctx.restore();
    }
    if (alive && el < 6000) raf = requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
  })(t0);
}
function showWelcome(){
  document.getElementById("w1").textContent = T("w1");
  document.getElementById("w2").textContent = T("w2");
  document.getElementById("wtap").textContent = T("wtap");
  document.getElementById("w3").hidden = LANG === "zh";
  document.body.classList.add("locked"); toTop();
  wel.classList.remove("hide","run"); void wel.offsetWidth; wel.classList.add("run");
  confetti(); clearTimeout(wTimer); wTimer = setTimeout(hideWelcome, 4200);
}
function hideWelcome(){ clearTimeout(wTimer); wel.classList.add("hide"); document.body.classList.remove("locked"); setTimeout(() => cancelAnimationFrame(raf), 650); }
wel.addEventListener("click", hideWelcome);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !wel.classList.contains("hide")) hideWelcome(); });

function applyLang(){
  document.documentElement.lang = {fr:"fr", en:"en", zh:"zh-CN"}[LANG];
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  document.getElementById("sub").textContent = T("sub");
  q.placeholder = T("search");
  document.getElementById("qlabel").textContent = T("searchLabel");
  spicyBtn.textContent = T("spicy");
  nav.setAttribute("aria-label", T("nav"));
  document.getElementById("lbx").setAttribute("aria-label", T("close"));
  document.getElementById("foot").innerHTML = T("foot");
  buildNav(); renderContact(); render();
}
nav.addEventListener("click", e => {
  const a = e.target.closest("a.chip"); if (!a) return;
  e.preventDefault();
  const t = document.getElementById(a.dataset.id); if (!t) return;
  const smooth = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({top: t.getBoundingClientRect().top + scrollY - 112, behavior: smooth ? "smooth" : "instant"});
});
document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button[data-lang]"); if (!b || b.dataset.lang === LANG) return;
  LANG = b.dataset.lang; try { localStorage.setItem("shangrila-lang", LANG); } catch(e){}
  applyLang(); showWelcome();
});

function render(){
  ALL.length = 0;
  const term = norm(q.value.trim());
  let html = "", shown = 0;
  for (const cat of MENU){
    let rows = "", pendingGroup = null, count = 0;
    for (const it of cat.items){
      if (it.g){ pendingGroup = it.g; continue; }
      const hay = norm([it.n||"", it.name, it.d||"", ...(ZH[it.name]||[]), ...(EN[it.name]||[])].join(" "));
      if (term && !hay.includes(term)) continue;
      if (spicyOnly && !it.s) continue;
      if (pendingGroup){ rows += `<li class="group" style="display:block;border:0;padding:0">${esc(grpT(pendingGroup))}</li>`; pendingGroup = null; }
      const chili = it.s ? `<span class="chili" aria-label="${it.s>1?T("spicy2"):T("spicy1")}">${"🌶".repeat(it.s)}</span>` : "";
      const nw = it.nw ? `<span class="new">${T("nw")}</span>` : "";
      const price = it.p == null ? `<span class="price ask">${T("ask")}</span>`
        : `<span class="price">${fmt(it.p)}${it.p2 ? `<br>${fmt(it.p2)}` : ""}</span>`;
      const ph = photoFor(it); let attrs = "";
      if (ph){ ALL.push(it); attrs = ` class="photo" tabindex="0" role="button" data-i="${ALL.length-1}" aria-label="${T("view")}${esc(nm(it))}"`; }
      rows += `<li${attrs}>${ph?`<img class="thumb" src="${ph}" alt="" loading="lazy">`:""}${it.n?`<span class="no">${esc(it.n)}</span>`:""}<span class="name">${esc(nm(it))}${chili}${nw}${ds(it)?`<span class="desc">${esc(ds(it))}</span>`:""}</span>${price}</li>`;
      count++;
    }
    if (count){ shown += count; html += `<section id="${cat.id}"><h2>${esc(secT(cat))}</h2><ul>${rows}</ul></section>`; }
    nav.querySelector(`[data-id="${cat.id}"]`).style.display = count ? "" : "none";
  }
  main.innerHTML = shown ? html : `<p class="empty">${T("empty")}</p>`;
  observe();
}

let io;
function observe(){
  if (io) io.disconnect();
  io = new IntersectionObserver(entries => {
    for (const e of entries) if (e.isIntersecting){
      nav.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.id === e.target.id));
      const on = nav.querySelector(".chip.on"); if (on) nav.scrollTo({left: on.offsetLeft - (nav.clientWidth - on.offsetWidth)/2});
    }
  }, {rootMargin:"-130px 0px -70% 0px"});
  main.querySelectorAll("section").forEach(s => io.observe(s));
  io.observe(document.getElementById("contact"));
}

const lb=document.getElementById("lb"), lbimg=document.getElementById("lbimg");
let lastFocus=null;
function openLb(it){ lastFocus=document.activeElement; lbimg.src=photoFor(it); lbimg.alt=nm(it);
  document.getElementById("lbname").textContent=nm(it);
  document.getElementById("lbprice").textContent= it.p==null ? T("ask") : fmt(it.p);
  lb.classList.add("open"); document.getElementById("lbx").focus(); }
function closeLb(){ lb.classList.remove("open"); lbimg.removeAttribute("src"); if(lastFocus) lastFocus.focus(); }
main.addEventListener("click", e=>{ const li=e.target.closest("li.photo"); if(li) openLb(ALL[+li.dataset.i]); });
main.addEventListener("keydown", e=>{ const li=e.target.closest("li.photo"); if(li && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); openLb(ALL[+li.dataset.i]); }});
lb.addEventListener("click", e=>{ if(e.target===lb || e.target.id==="lbx") closeLb(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && lb.classList.contains("open")) closeLb(); });
q.addEventListener("input", render);
spicyBtn.addEventListener("click", () => { spicyOnly = !spicyOnly; spicyBtn.setAttribute("aria-pressed", spicyOnly); render(); });
applyLang();
showWelcome();
